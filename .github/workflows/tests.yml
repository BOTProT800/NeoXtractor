name: Tests Workflow

on:
  workflow_call:

jobs:
  test:
    name: Tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version-file: ".python-version"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.22"

      - name: Install dependencies
        shell: bash
        run: uv sync --locked --group dev

      # The official Khronos glTF-Validator is only published on npm. Pinned,
      # because tests/support/khronos.py lists the infos this version emits.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the Khronos glTF-Validator
        shell: bash
        run: npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/gltf-validator" gltf-validator@2.0.0-dev.3.10

      - name: Run tests
        shell: bash
        env:
          NEOX_GLTF_VALIDATOR: ${{ runner.temp }}/gltf-validator/node_modules/gltf-validator
        run: uv run pytest -q
