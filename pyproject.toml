[project]
name = "neoxtractor"
version = "3.0.1"
description = "NeoX NXPK / EXPK (.npk) extraction and viewer tool"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "arc4>=0.5.0",
    "bitstring>=4.4.0",
    "lz4>=4.4.5",
    "numpy>=2.4.4",
    "p>=1.5.0",
    "pillow>=12.2.0",
    "pycryptodome>=3.23.0",
    "pymeshio>=3.0.1",
    "pyside6<6.10.0",
    "zstandard>=0.25.0",
    "texture2ddecoder>=1.0.6",
    "cryptography>=46.0.7",
    "flatbuffers>=25.12.19",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    # Two unrelated glTF/GLB implementations, used to cross-check the exporter
    # output against something that shares no code with it.
    "pygltflib>=1.16",
    "trimesh>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64' and platform_release <= '22'"
]
